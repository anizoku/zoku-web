<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOKU — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1E1F22;
        color: #F2F3F5;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .container {
        max-width: 400px;
      }
      .logo {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(135deg, #00FF88, #6DFF3C);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1.5rem;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #949BA4;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 16px;
        background: linear-gradient(135deg, #00FF88, #6DFF3C);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 900;
        color: #1E1F22;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">Z</div>
      <div class="logo">ZOKU</div>
      <h1>Você está offline</h1>
      <p>Não foi possível carregar o conteúdo. Verifique sua conexão com a internet e tente novamente.</p>
    </div>
  </body>
</html>
